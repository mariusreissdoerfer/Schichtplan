<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vereinsinventar">
<title>Vereinsinventar</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --p:#2563EB;
  --p2:#1D4ED8;
  --pl:#EFF6FF;
  --ok:#16A34A;
  --warn:#D97706;
  --err:#DC2626;
  --t1:#0F172A;
  --t2:#475569;
  --t3:#94A3B8;
  --sep:#E2E8F0;
  --r:16px;
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--t1);overscroll-behavior:none}
input,select,textarea,button{font-family:inherit}
input,select,textarea{font-size:16px!important;color:var(--t1)}
::-webkit-scrollbar{display:none}
.page{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px)+80px);
  opacity:0;transition:opacity .2s ease;overscroll-behavior-y:contain}
.page.active{opacity:1}

/* Cards */
.c{background:var(--card);border-radius:var(--r);overflow:hidden}
.c-p{padding:16px}
.c + .c{margin-top:10px}
.shadow{box-shadow:0 2px 12px rgba(0,0,0,.08)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:14px;font-weight:600;font-size:15px;cursor:pointer;
  border:none;outline:none;transition:transform .1s,opacity .1s;padding:13px 20px}
.btn:active{transform:scale(.96);opacity:.9}
.btn-p{background:var(--p);color:#fff}
.btn-s{background:#F1F5F9;color:var(--t2)}
.btn-d{background:#FEE2E2;color:var(--err)}
.btn-g{background:transparent;color:var(--p);padding:8px 0}

/* Inputs */
.inp{width:100%;background:#F8FAFC;border:1.5px solid var(--sep);border-radius:12px;
  padding:13px 14px;font-size:16px;outline:none;transition:border-color .2s,background .2s}
.inp:focus{border-color:var(--p);background:#fff}
textarea.inp{resize:none}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:5px;letter-spacing:.3px}
.field{display:flex;flex-direction:column;gap:0}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

/* Toggle */
.tgl{position:relative;width:51px;height:31px;background:#E5E7EB;border-radius:20px;
  cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl.on{background:var(--p)}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;
  background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on::after{transform:translateX(20px)}

/* Nav */
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:8px 4px;position:relative;transition:color .15s}
.nav-item svg{transition:transform .15s}
.nav-item.active{color:var(--p)}
.nav-item:not(.active){color:#9CA3AF}
.nav-dot{position:absolute;top:4px;width:4px;height:4px;border-radius:50%;
  background:var(--p);opacity:0;transition:opacity .2s}
.nav-item.active .nav-dot{opacity:1}

/* Modal */
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-radius:24px 24px 0 0;z-index:60;display:flex;flex-direction:column;
  max-height:94vh;box-shadow:0 -4px 30px rgba(0,0,0,.15);
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:#D1D5DB;margin:10px auto 4px}
.sheet-title{font-size:18px;font-weight:700;padding:4px 20px 16px;color:var(--t1)}
.sheet-body{overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:0 20px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px)+20px);flex:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}
.overlay.show{opacity:1;pointer-events:all}

/* Segment */
.seg{display:flex;background:#E9ECEF;border-radius:10px;padding:2px;gap:2px}
.seg-item{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;
  text-align:center;cursor:pointer;transition:background .2s,color .2s;color:var(--t2)}
.seg-item.active{background:#fff;color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* Search */
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.search-inp{padding-left:38px;padding-right:36px}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:#CBD5E1;border:none;border-radius:50%;width:20px;height:20px;
  color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Chip */
.chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;
  font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;
  white-space:nowrap;transition:all .15s}

/* Stat card */
.stat-card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.stat-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat-lbl{font-size:13px;color:var(--t2);font-weight:500}
.stat-sub{font-size:12px;color:var(--t3)}

/* Item card */
.item-row{display:flex;gap:12px;padding:14px;align-items:center}
.item-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.item-bar{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0}

/* List row */
.list-row{display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--card);border-bottom:1px solid var(--sep)}
.list-row:last-child{border-bottom:none}

/* Section header */
.sec-hdr{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.6px;
  text-transform:uppercase;padding:24px 20px 8px;line-height:1}

/* FAB */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+80px);right:20px;
  z-index:30;width:56px;height:56px;border-radius:28px;background:var(--p);
  color:#fff;border:none;box-shadow:0 4px 20px rgba(37,99,235,.5);
  font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s}
.fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(37,99,235,.4)}

/* Header */
.hdr{position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,#1E40AF,#2563EB,#3B82F6);
  padding:max(14px,env(safe-area-inset-top,14px)) 16px 14px;
  display:flex;align-items:center;gap:12px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fadeUp{animation:fadeUp .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px);pointer-events:none}}
.toast-el{animation:toastIn .3s ease,toastOut .3s 2.8s forwards}

/* Divider */
.divider{height:1px;background:var(--sep);margin:0 16px}

/* Settings row */
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);
  border-bottom:1px solid var(--sep);cursor:pointer;transition:background .15s}
.srow:active{background:#F8FAFC}
.srow:last-child{border-bottom:none}
.srow-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:17px;flex-shrink:0}

/* Pull indicator */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;gap:12px}
.empty-icon{font-size:56px;opacity:.35}
.empty-text{font-size:17px;font-weight:600;color:var(--t2);text-align:center}
.empty-sub{font-size:14px;color:var(--t3);text-align:center}

/* iOS-style group */
.igroup{border-radius:var(--r);overflow:hidden;background:var(--card)}

/* Confirm dialog */
.dlg{background:#fff;border-radius:20px;width:280px;text-align:center;
  overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-btns{display:flex;border-top:1px solid var(--sep)}
.dlg-btn{flex:1;padding:14px;font-size:17px;cursor:pointer;background:none;border:none;
  font-family:inherit;transition:background .15s}
.dlg-btn:active{background:#F8FAFC}
.dlg-btn + .dlg-btn{border-left:1px solid var(--sep);color:var(--err);font-weight:700}
</style>
</head>
<body>

<!-- TOAST -->
<div id="toasts" style="position:fixed;top:max(16px,env(safe-area-inset-top,16px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:360px;pointer-events:none"></div>

<!-- OVERLAY -->
<div id="ov" class="overlay" onclick="closeModal()"></div>

<!-- MODAL -->
<div id="modal" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="mtitle"></div>
  <div class="sheet-body" id="mbody"></div>
</div>

<!-- CONFIRM -->
<div id="cdlg" style="position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(6px)">
  <div class="dlg fadeUp">
    <div style="padding:24px 20px 16px">
      <div id="cdlg-t" style="font-size:17px;font-weight:700;color:var(--t1);margin-bottom:8px"></div>
      <div id="cdlg-m" style="font-size:15px;color:var(--t2);line-height:1.5"></div>
    </div>
    <div class="dlg-btns">
      <button class="dlg-btn" onclick="document.getElementById('cdlg').style.display='none'">Abbrechen</button>
      <button class="dlg-btn" id="cdlg-ok">Löschen</button>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div style="position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden">

  <!-- PAGES CONTAINER -->
  <div style="flex:1;min-height:0;position:relative;overflow:hidden">
    <div id="pg-dashboard" class="page"></div>
    <div id="pg-items" class="page"></div>
    <div id="pg-rentals" class="page"></div>
    <div id="pg-warehouses" class="page"></div>
    <div id="pg-more" class="page"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div style="background:#fff;border-top:1px solid var(--sep);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)">
    <div style="display:flex;height:56px">
      <div class="nav-item active" id="nav-dashboard" onclick="go('dashboard')">
        <div class="nav-dot"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span style="font-size:10px;font-weight:600">Übersicht</span>
      </div>
      <div class="nav-item" id="nav-items" onclick="go('items')">
        <div class="nav-dot"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span style="font-size:10px;font-weight:600">Inventar</span>
      </div>
      <div class="nav-item" id="nav-rentals" onclick="go('rentals')">
        <div class="nav-dot"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span style="font-size:10px;font-weight:600">Verleih</span>
      </div>
      <div class="nav-item" id="nav-warehouses" onclick="go('warehouses')">
        <div class="nav-dot"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <span style="font-size:10px;font-weight:600">Lager</span>
      </div>
      <div class="nav-item" id="nav-more" onclick="go('more')">
        <div class="nav-dot"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span style="font-size:10px;font-weight:600">Mehr</span>
      </div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="fabAction()" title="Neu hinzufügen">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const DEMO={
  categories:[
    {id:1,name:'Zelte & Unterkünfte',color:'#F59E0B',emoji:'⛺'},
    {id:2,name:'Möbel',color:'#10B981',emoji:'🪑'},
    {id:3,name:'Elektro',color:'#3B82F6',emoji:'⚡'},
    {id:4,name:'Küche & Catering',color:'#EF4444',emoji:'🍳'},
    {id:5,name:'Transport & Lagerung',color:'#8B5CF6',emoji:'📦'},
  ],
  warehouses:[
    {id:1,name:'Lagerhalle 1',address:'Musterstraße 1, 12345 Musterstadt'},
    {id:2,name:'Lagerhalle 2',address:'Nebenstraße 5, 12345 Musterstadt'},
  ],
  locations:[
    {id:1,wid:1,name:'Eingangsbereich'},{id:2,wid:1,name:'Regal A'},
    {id:3,wid:1,name:'Regal B'},{id:4,wid:2,name:'Hauptfläche'},
    {id:5,wid:2,name:'Außenbereich'},
  ],
  items:[
    {id:1,name:'Festzelt 6×12m',desc:'Weißes Partyzelt mit 4 Seitenwänden',cid:1,qty:1,cond:'gut',price:1200,rent:true,day:50,wknd:80,lid:4,notes:'Heringe separat im Zubehörkasten'},
    {id:2,name:'Biertisch-Set (4+8)',desc:'4 Tische + 8 Bierbänke, klappbar',cid:2,qty:5,cond:'gut',price:80,rent:true,day:10,wknd:15,lid:2,notes:''},
    {id:3,name:'Grillwagen groß',desc:'Holzkohlegrillwagen, 120 cm Grillrost',cid:4,qty:2,cond:'sehr gut',price:350,rent:true,day:20,wknd:30,lid:1,notes:'Reinigung nach Verleih nötig'},
    {id:4,name:'Verlängerungskabel 50m',desc:'Gelbes 16A Kabel mit Mehrfachsteckdose',cid:3,qty:3,cond:'gut',price:45,rent:true,day:5,wknd:8,lid:3,notes:''},
    {id:5,name:'IBC-Container 1000L',desc:'Kunststoff-Gitterbox für Wasser',cid:5,qty:4,cond:'befriedigend',price:180,rent:false,day:null,wknd:null,lid:5,notes:'Nicht für Lebensmittel'},
    {id:6,name:'Kunststoffbecher 0,4L',desc:'Transparente Wiederverwendungsbecher',cid:4,qty:250,cond:'gut',price:0.8,rent:true,day:15,wknd:20,lid:2,notes:'Preis pauschal'},
  ],
  rentals:[
    {id:1,iid:1,name:'SVG Musterclub',phone:'0151 12345678',email:'kontakt@svg-musterclub.de',addr:'Vereinsstraße 10, 12345 Musterstadt',s:'2026-03-28',e:'2026-04-01',qty:1,status:'ausgeliehen',pt:'daily',total:250,notes:'Aufbau Do, Abbau Mi'},
    {id:2,iid:2,name:'Familie Müller',phone:'0170 9876543',email:'',addr:'Gartenweg 3, 12345 Musterstadt',s:'2026-04-05',e:'2026-04-06',qty:2,status:'reserviert',pt:'weekend',total:30,notes:'Geburtstagsfeier im Garten'},
    {id:3,iid:4,name:'Brauerei Hopfen GmbH',phone:'089 445566',email:'events@brauerei-hopfen.de',addr:'Brauereiweg 1, 80333 München',s:'2026-04-10',e:'2026-04-12',qty:2,status:'reserviert',pt:'daily',total:30,notes:''},
    {id:4,iid:3,name:'Schulverein GS Muster',phone:'',email:'sv@gs-muster.de',addr:'Schulstraße 1, 12345 Musterstadt',s:'2026-03-20',e:'2026-03-21',qty:1,status:'zurückgegeben',pt:'weekend',total:30,notes:'Frühlingsfest'},
  ]
};

// ── STATE ────────────────────────────────────────────────────────────────────
let D = (() => { try { const r=JSON.parse(localStorage.getItem('vi2')); return r||JSON.parse(JSON.stringify(DEMO)); } catch(e){ return JSON.parse(JSON.stringify(DEMO)); }})();
let curTab='dashboard', itemSearch='', itemCat=0, rentalSeg='alle', _nid=0;
function nid(){ if(!_nid){ const all=[...D.items,...D.categories,...D.warehouses,...D.locations,...D.rentals]; _nid=all.length?Math.max(...all.map(x=>x.id))+1:100; } return _nid++; }
function save(){ try{ localStorage.setItem('vi2',JSON.stringify(D)); }catch(e){} }

// ── HELPERS ──────────────────────────────────────────────────────────────────
const e=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eu=s=>String(s||'').replace(/'/g,"\\'");
const fmt=n=>n!=null?Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'}):'–';
const fdate=d=>{if(!d)return'–';const[y,m,dd]=d.split('-');return`${dd}.${m}.${y.slice(2)}`;};
const days=(a,b)=>Math.max(1,Math.ceil((new Date(b)-new Date(a))/864e5)+1);
const cat=id=>D.categories.find(x=>x.id===id);
const loc=id=>D.locations.find(x=>x.id===id);
const wh=id=>D.warehouses.find(x=>x.id===id);
const item=id=>D.items.find(x=>x.id===id);
const locFull=id=>{const l=loc(id);if(!l)return'–';const w=wh(l.wid);return w?`${w.name} › ${l.name}`:l.name;};
const condCol=c=>({neuwertig:'#16A34A','sehr gut':'#16A34A',gut:'#2563EB',befriedigend:'#D97706','reparaturbedürftig':'#DC2626'}[c]||'#94A3B8');
const condBg=c=>({neuwertig:'#DCFCE7','sehr gut':'#DCFCE7',gut:'#DBEAFE',befriedigend:'#FEF3C7','reparaturbedürftig':'#FEE2E2'}[c]||'#F1F5F9');
const statusCol=s=>({reserviert:'#D97706',ausgeliehen:'#2563EB',zurückgegeben:'#16A34A',storniert:'#94A3B8'}[s]||'#94A3B8');
const statusBg=s=>({reserviert:'#FEF3C7',ausgeliehen:'#DBEAFE',zurückgegeben:'#DCFCE7',storniert:'#F1F5F9'}[s]||'#F1F5F9');
function avail(iid,s,e_,qty,excId=null){
  const itm=item(iid);if(!itm)return{ok:false,n:0,total:0};
  const used=D.rentals.filter(r=>r.iid===iid&&r.id!==excId&&!['zurückgegeben','storniert'].includes(r.status)&&r.s<=e_&&r.e>=s).reduce((a,r)=>a+r.qty,0);
  return{ok:(itm.qty-used)>=qty,n:itm.qty-used,total:itm.qty};
}

// ── NAVIGATE ─────────────────────────────────────────────────────────────────
function go(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  curTab=tab;
  document.getElementById(`pg-${tab}`).classList.add('active');
  document.getElementById(`nav-${tab}`).classList.add('active');
  document.getElementById('fab').style.display=(['items','rentals'].includes(tab))?'flex':'none';
  render(tab);
  document.getElementById(`pg-${tab}`).scrollTop=0;
}

function fabAction(){ curTab==='items'?openItemForm():openRentalForm(); }

function render(tab){
  const pg=document.getElementById(`pg-${tab}`);
  if(tab==='dashboard') pg.innerHTML=renderDash();
  else if(tab==='items') pg.innerHTML=renderItems();
  else if(tab==='rentals') pg.innerHTML=renderRentals();
  else if(tab==='warehouses') pg.innerHTML=renderWH();
  else if(tab==='more') pg.innerHTML=renderMore();
}

function saveItem(e_,id){
  e_.preventDefault();const f=e_.target;
  const rentable=document.getElementById('rentgl').classList.contains('on');
  const data={name:f.name.value.trim(),desc:f.desc.value.trim(),cid:parseInt(f.cid.value)||null,qty:parseInt(f.qty.value)||1,cond:f.cond.value,price:parseFloat(f.price.value)||null,rent:rentable,day:rentable?(parseFloat(f.day.value)||null):null,wknd:rentable?(parseFloat(f.wknd.value)||null):null,lid:parseInt(f.lid.value)||null,notes:f.notes.value.trim()};
  if(!data.name){toast('Name ist Pflichtfeld','err');return;}
  if(id){Object.assign(item(id),data);toast('Gespeichert');}
  else{D.items.push({id:nid(),...data});toast('Angelegt');}
  save();closeModal();render('items');
}

function delItem(id){
  const itm=item(id);if(!itm)return;
  if(D.rentals.some(r=>r.iid===id&&!['zurückgegeben','storniert'].includes(r.status))){toast('Hat aktive Verleihe – zuerst abschließen','err');return;}
  confirm_(`"${itm.name}" löschen?`,()=>{D.items=D.items.filter(i=>i.id!==id);D.rentals=D.rentals.filter(r=>r.iid!==id);save();toast('Gelöscht');render('items');});
}

      <div class="field"><label class="lbl">Menge</label><input class="inp" type="number" min="1" name="qty" id="rf-qty" value="${r?.qty||1}" onchange="rfCalc();rfAvail()"></div>
      <div class="field"><label class="lbl">Preismodell</label><select class="inp" name="pt" id="rf-pt" onchange="rfCalc()">
        <option value="daily"${(!r||r.pt==='daily')?' selected':''}>Tagespreis</option>
        <option value="weekend"${r?.pt==='weekend'?' selected':''}>Wochenende</option>
        <option value="custom"${r?.pt==='custom'?' selected':''}>Individuell</option>
        <option value="free"${r?.pt==='free'?' selected':''}>Kostenlos</option>

    </div>
    <div id="rf-avail" style="display:none;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600"></div>
    <div id="rf-price-box" style="display:none;background:#EFF6FF;border-radius:12px;padding:12px 14px;display:none;align-items:center;justify-content:space-between">

      <span id="rf-price-val" style="font-size:20px;font-weight:800;color:#1D4ED8"></span>
    </div>
    <div id="rf-custom" style="display:none" class="field"><label class="lbl">Gesamtpreis (€)</label><input class="inp" type="number" step="0.01" name="total" value="${r?.total||''}"></div>
    ${r?`<div class="field"><label class="lbl">Status</label><select class="inp" name="status">
      ${['reserviert','ausgeliehen','zurückgegeben','storniert'].map(s=>`<option${r.status===s?' selected':''}>${s}</option>`).join('')}

function rfCalc(){
  const isel=document.getElementById('rf-iid'),sd=document.getElementById('rf-sd'),ed=document.getElementById('rf-ed'),qty_el=document.getElementById('rf-qty'),pt_el=document.getElementById('rf-pt');
  const pb=document.getElementById('rf-price-box'),pv=document.getElementById('rf-price-val'),cp=document.getElementById('rf-custom');
  if(!sd||!ed||!pt_el)return;
  const pt=pt_el.value;
  if(pt==='custom'){if(pb)pb.style.display='none';if(cp)cp.style.display='block';return;}
  if(cp)cp.style.display='none';
  const iid=isel?parseInt(isel.value):null;
  const itm=iid?item(iid):null;
  const s=sd.value,e_=ed.value,qty=parseInt(qty_el?.value)||1;
  if(!s||!e_||e_<s){if(pb)pb.style.display='none';return;}
  let price=null;
  if(pt==='free') price=0;
  else if(pt==='weekend'&&itm?.wknd) price=itm.wknd*qty;
  else if(itm?.day) price=itm.day*days(s,e_)*qty;
  if(price!==null&&pb&&pv){pb.style.display='flex';pv.textContent=fmt(price);}
  else if(pb) pb.style.display='none';
}

function rfAvail(){
  const isel=document.getElementById('rf-iid'),sd=document.getElementById('rf-sd'),ed=document.getElementById('rf-ed'),qty_el=document.getElementById('rf-qty'),el=document.getElementById('rf-avail');
  if(!el)return;
  const iid=isel?parseInt(isel.value):null;
  const s=sd?.value,e_=ed?.value,qty=parseInt(qty_el?.value)||1;
  if(!iid||!s||!e_){el.style.display='none';return;}
  const av=avail(iid,s,e_,qty);
  el.style.display='flex';el.style.alignItems='center';el.style.gap='8px';
  if(av.ok){el.style.background='#DCFCE7';el.style.color='#15803D';el.innerHTML=`<span style="font-size:18px">✓</span> Verfügbar (${av.n} von ${av.total})`;}
  else{el.style.background='#FEE2E2';el.style.color='#DC2626';el.innerHTML=`<span style="font-size:18px">✗</span> Nicht verfügbar! Nur ${av.n} von ${av.total} frei`;}
}

function saveRental(ev,id){
  ev.preventDefault();const f=ev.target;
  const iid_el=document.getElementById('rf-iid');
  const iid=iid_el?parseInt(iid_el.value):(id?D.rentals.find(r=>r.id===id)?.iid:null);
  const s=f.sd.value,e_=f.ed.value,qty=parseInt(f.qty.value)||1;
  if(!iid){toast('Gegenstand wählen','err');return;}
  if(e_<s){toast('Enddatum vor Startdatum','err');return;}
  const av=avail(iid,s,e_,qty,id);
  if(!av.ok){toast(`Nicht verfügbar! Nur ${av.n} verfügbar`,'err');return;}
  const pt=f.pt.value;
  const itm=item(iid);
  let total=null;
  if(pt==='custom') total=parseFloat(f.total?.value)||null;
  else if(pt==='weekend'&&itm?.wknd) total=itm.wknd*qty;
  else if(pt==='daily'&&itm?.day) total=itm.day*days(s,e_)*qty;
  const data={iid,name:f.bname.value.trim(),phone:f.bphone.value.trim(),email:f.bemail.value.trim(),addr:f.baddr.value.trim(),s,e:e_,qty,status:f.status?.value||'reserviert',pt,total,notes:f.notes.value.trim()};
  if(!data.name){toast('Name ist Pflichtfeld','err');return;}
  if(id){Object.assign(D.rentals.find(r=>r.id===id),data);toast('Gespeichert');}
  else{D.rentals.push({id:nid(),...data});toast('Verleih angelegt');}
  save();closeModal();render('rentals');
}

function delRental(id){
  const r=D.rentals.find(x=>x.id===id);if(!r)return;
  confirm_(`Verleih "${item(r.iid)?.name||'?'}" an ${r.name} löschen?`,()=>{D.rentals=D.rentals.filter(x=>x.id!==id);save();toast('Gelöscht');render('rentals');});
}

          <div style="display:flex;gap:6px">
            <button onclick="openCatForm(${c.id})" style="width:30px;height:30px;border-radius:8px;background:#F1F5F9;border:none;cursor:pointer;font-size:13px">✏️</button>
            <button onclick="delCat(${c.id})" style="width:30px;height:30px;border-radius:8px;background:#FEE2E2;border:none;cursor:pointer;font-size:13px">🗑</button>
          </div>
        </div>`).join('')}
        <button onclick="openCatForm()" style="width:100%;padding:14px 16px;background:none;border:none;border-top:1px solid var(--sep);font-size:14px;color:var(--p);font-weight:700;cursor:pointer;text-align:left">+ Kategorie hinzufügen</button>
      </div>
    </div>
    <div>
      <div class="sec-hdr" style="padding:0 0 10px">Demo & Daten</div>
      <div class="igroup shadow">
        <div class="srow" style="border:none;cursor:default">
          <div class="srow-icon" style="background:#DCFCE7">💾</div>
          <div style="flex:1"><div style="font-weight:600">Lokaler Speicher</div><div style="font-size:13px;color:var(--t2)">Alle Daten bleiben auf diesem Gerät</div></div>
        </div>
      </div>
      <button onclick="resetDemo()" class="btn btn-d" style="width:100%;margin-top:10px">🔄 Demo-Daten zurücksetzen</button>
    </div>
    <div class="igroup shadow" style="padding:16px">
      <div style="font-size:13px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Info</div>
      <div style="font-size:15px;font-weight:700;color:var(--t1)">Vereinsinventar</div>
      <div style="font-size:14px;color:var(--t2);margin-top:4px">Inventar- & Verleihverwaltung für Bürgervereine</div>
      <div style="font-size:13px;color:var(--t3);margin-top:8px">Dies ist eine Demo-Version ohne Serveranbindung.</div>
    </div>
    <div style="height:8px"></div>
  </div>`;
  return h;
}

function openCatForm(id=null){
  const c=id?D.categories.find(x=>x.id===id):null;
  const colors=['#EF4444','#F97316','#F59E0B','#10B981','#22C55E','#3B82F6','#6366F1','#8B5CF6','#EC4899','#64748B'];
  const emojis=['⛺','🪑','⚡','🍳','📦','🔧','🎪','🚛','🎭','📋'];
  let h=`<form onsubmit="saveCat(event,${id||'null'})"><div style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label class="lbl">Name *</label><input class="inp" name="name" required placeholder="z.B. Werkzeug" value="${e(c?.name||'')}"></div>
    <div><label class="lbl">Farbe</label>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px">
        ${colors.map(col=>`<button type="button" onclick="document.getElementById('ccolor').value='${col}';document.querySelectorAll('.cc-dot').forEach(d=>d.style.border='none');this.style.border='3px solid #0F172A'" class="cc-dot" style="width:36px;height:36px;border-radius:50%;background:${col};border:${c?.color===col?'3px solid #0F172A':'none'};cursor:pointer"></button>`).join('')}
        <input type="hidden" name="color" id="ccolor" value="${c?.color||'#6366F1'}">
      </div>
    </div>
    <div><label class="lbl">Emoji</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
        ${emojis.map(em=>`<button type="button" onclick="document.getElementById('cemoji').value='${em}';document.querySelectorAll('.ce-btn').forEach(b=>b.style.background='#F1F5F9');this.style.background='#DBEAFE'" class="ce-btn" style="width:44px;height:44px;border-radius:12px;font-size:20px;background:${c?.emoji===em?'#DBEAFE':'#F1F5F9'};border:none;cursor:pointer">${em}</button>`).join('')}
        <input type="hidden" name="emoji" id="cemoji" value="${c?.emoji||'📦'}">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:8px">
      <button type="button" class="btn btn-s" onclick="closeModal()">Abbrechen</button>
      <button type="submit" class="btn btn-p">Speichern</button>
    </div>
  </div></form>`;
  openModal(c?'Kategorie bearbeiten':'Neue Kategorie',h);
}
function saveCat(ev,id){
  ev.preventDefault();const f=ev.target;
  const data={name:f.name.value.trim(),color:f.color.value||'#6366F1',emoji:f.emoji.value||'📦'};
  if(!data.name){toast('Name Pflichtfeld','err');return;}
  if(id){Object.assign(D.categories.find(x=>x.id===id),data);toast('Gespeichert');}
  else{D.categories.push({id:nid(),...data});toast('Kategorie angelegt');}
  save();closeModal();render('more');
}
function delCat(id){
  if(D.items.some(i=>i.cid===id)){toast('Kategorie noch in Verwendung','err');return;}
  confirm_('Kategorie löschen?',()=>{D.categories=D.categories.filter(x=>x.id!==id);save();toast('Gelöscht');render('more');});
}
function resetDemo(){
  confirm_('Alle Daten auf Demo-Zustand zurücksetzen?',()=>{
    D=JSON.parse(JSON.stringify(DEMO));_nid=0;save();toast('Demo-Daten zurückgesetzt');go('dashboard');
  });
}

// ── MODAL ────────────────────────────────────────────────────────────────────
let _startY=0,_isDrag=false;
function openModal(title,body){
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mbody').innerHTML=body;
  const ov=document.getElementById('ov'),m=document.getElementById('modal');
  ov.classList.add('show');m.classList.add('open');
  // Swipe to close
  const sh=m.querySelector('.sheet-handle');
  if(sh){
    sh.addEventListener('touchstart',e_=>{_startY=e_.touches[0].clientY;_isDrag=true;},{passive:true});
    sh.addEventListener('touchmove',e_=>{if(!_isDrag)return;const dy=e_.touches[0].clientY-_startY;if(dy>0)m.style.transform=`translateY(${dy}px)`;},{passive:true});
    sh.addEventListener('touchend',e_=>{if(!_isDrag)return;_isDrag=false;const dy=e_.changedTouches[0].clientY-_startY;if(dy>80)closeModal();else m.style.transform='';});
  }
}
function closeModal(){
  const ov=document.getElementById('ov'),m=document.getElementById('modal');
  m.style.transform='';m.classList.remove('open');ov.classList.remove('show');
  setTimeout(()=>{document.getElementById('mbody').innerHTML='';},350);
}

// ── CONFIRM ──────────────────────────────────────────────────────────────────
function confirm_(msg,cb){
  const d=document.getElementById('cdlg');
  document.getElementById('cdlg-m').textContent=msg;
  d.style.display='flex';
  document.getElementById('cdlg-ok').onclick=()=>{d.style.display='none';cb();};
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg,type='ok'){
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast-el';
  el.style.cssText=`background:${type==='err'?'#DC2626':type==='warn'?'#D97706':'#16A34A'};color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);pointer-events:all`;
  el.innerHTML=`<span style="font-size:16px">${type==='err'?'✕':type==='warn'?'⚠':'✓'}</span>${msg}`;
  c.appendChild(el);
  setTimeout(()=>el.remove(),3300);
}

// ── INIT ─────────────────────────────────────────────────────────────────────
go('dashboard');
</script>
</body>
</html>
